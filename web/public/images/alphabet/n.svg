<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter N">
  <defs>
    <linearGradient id="gnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0dce8"/>
      <stop offset="0.45" stop-color="#4e789a"/>
      <stop offset="1" stop-color="#3a5a78"/>
    </linearGradient>
    <linearGradient id="gnShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gnGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#90b0cc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a5a78" stop-opacity="0"/>
    </radialGradient>
    <filter id="gnSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3a5a78" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gnBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gnGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gnShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gnSoft)" letter-spacing="-4">N</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">N</text>
  <!-- motif -->
  <g opacity="0.96">
        <ellipse cx="236" cy="292" rx="34" ry="14" fill="#8a6238"/>
        <ellipse cx="236" cy="286" rx="28" ry="9" fill="#6e4c2a"/>
        <ellipse cx="226" cy="274" rx="10" ry="14" fill="#fff4d8"/>
        <ellipse cx="246" cy="272" rx="10" ry="14" fill="#ffe8b0"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#3a5a78" opacity="0.85"/>
</svg>
