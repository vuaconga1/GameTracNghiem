<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter J">
  <defs>
    <linearGradient id="gjBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe0c4"/>
      <stop offset="0.45" stop-color="#b08c38"/>
      <stop offset="1" stop-color="#8a6d28"/>
    </linearGradient>
    <linearGradient id="gjShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gjGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#e8c86a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8a6d28" stop-opacity="0"/>
    </radialGradient>
    <filter id="gjSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8a6d28" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gjBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gjGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gjShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gjSoft)" letter-spacing="-4">J</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">J</text>
  <!-- motif -->
  <g opacity="0.96">
        <path d="M214 248h44l-7 48h-30z" fill="#ffa64d"/>
        <rect x="212" y="242" width="48" height="9" rx="3" fill="#fff8e8"/>
        <ellipse cx="236" cy="248" rx="16" ry="4" fill="#ffcf80" opacity="0.7"/>
        <path d="M256 254c10 3 14 14 7 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
