<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter Z">
  <defs>
    <linearGradient id="gzBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8d6e6"/>
      <stop offset="0.45" stop-color="#3e6a94"/>
      <stop offset="1" stop-color="#2a4a6b"/>
    </linearGradient>
    <linearGradient id="gzShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gzGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#80a8d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a4a6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="gzSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2a4a6b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gzBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gzGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gzShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gzSoft)" letter-spacing="-4">Z</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">Z</text>
  <!-- motif -->
  <g opacity="0.96">
        <ellipse cx="236" cy="270" rx="34" ry="28" fill="#f5f0e8"/>
        <g stroke="#2b2118" stroke-width="7" stroke-linecap="round">
          <path d="M216 250c7 8 7 24 0 34"/>
          <path d="M230 246c5 10 5 28 0 42"/>
          <path d="M244 246c5 10 5 28 0 42"/>
          <path d="M256 252c5 8 5 24 0 32"/>
        </g>
        <circle cx="224" cy="266" r="3.5" fill="#2b2118"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#2a4a6b" opacity="0.85"/>
</svg>
