<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter M">
  <defs>
    <linearGradient id="gmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4d4ef"/>
      <stop offset="0.45" stop-color="#2a5a9a"/>
      <stop offset="1" stop-color="#1a3a6e"/>
    </linearGradient>
    <linearGradient id="gmShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gmGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#7090d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a3a6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="gmSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a3a6e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gmBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gmGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gmShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gmSoft)" letter-spacing="-4">M</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">M</text>
  <!-- motif -->
  <g opacity="0.96">
        <circle cx="236" cy="268" r="30" fill="#ffe08a"/>
        <circle cx="250" cy="256" r="24" fill="#1a3a6e" opacity="0.92"/>
        <circle cx="224" cy="260" r="4" fill="#e0b040" opacity="0.5"/>
        <circle cx="234" cy="280" r="3.5" fill="#e0b040" opacity="0.4"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#1a3a6e" opacity="0.85"/>
</svg>
