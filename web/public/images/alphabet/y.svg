<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter Y">
  <defs>
    <linearGradient id="gyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe4c0"/>
      <stop offset="0.45" stop-color="#b09428"/>
      <stop offset="1" stop-color="#8a7018"/>
    </linearGradient>
    <linearGradient id="gyShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gyGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#e8d060" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8a7018" stop-opacity="0"/>
    </radialGradient>
    <filter id="gySoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8a7018" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gyBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gyGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gyShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gySoft)" letter-spacing="-4">Y</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">Y</text>
  <!-- motif -->
  <g opacity="0.96">
        <path d="M236 236v58" fill="none" stroke="#fff" stroke-width="3.5"/>
        <path d="M240 242l34 42H240z" fill="#fff" opacity="0.92"/>
        <path d="M200 294h72l-8 14H208z" fill="#e85d4c"/>
        <path d="M190 308h90" fill="none" stroke="#7eb0ff" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#8a7018" opacity="0.85"/>
</svg>
