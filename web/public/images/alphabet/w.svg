<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter W">
  <defs>
    <linearGradient id="gwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0dde6"/>
      <stop offset="0.45" stop-color="#1a8094"/>
      <stop offset="1" stop-color="#0d5c6e"/>
    </linearGradient>
    <linearGradient id="gwShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gwGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#5ec8dc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d5c6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="gwSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0d5c6e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gwBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gwGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gwShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gwSoft)" letter-spacing="-4">W</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">W</text>
  <!-- motif -->
  <g opacity="0.96">
        <ellipse cx="230" cy="274" rx="36" ry="20" fill="#5b8fd9"/>
        <path d="M264 274l20-12v24z" fill="#3a6cb0"/>
        <circle cx="210" cy="268" r="4" fill="#0f2740"/>
        <path d="M204 284c8 6 20 6 28 0" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.5"/>
        <ellipse cx="220" cy="286" rx="12" ry="7" fill="#fff" opacity="0.35"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#0d5c6e" opacity="0.85"/>
