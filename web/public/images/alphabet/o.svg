<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter O">
  <defs>
    <linearGradient id="goBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8d8f4"/>
      <stop offset="0.45" stop-color="#3a6cc0"/>
      <stop offset="1" stop-color="#1e4a9a"/>
    </linearGradient>
    <linearGradient id="goShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="goGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#80a8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1e4a9a" stop-opacity="0"/>
    </radialGradient>
    <filter id="goSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e4a9a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#goBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#goGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#goShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#goSoft)" letter-spacing="-4">O</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">O</text>
  <!-- motif -->
  <g opacity="0.96">
        <circle cx="236" cy="270" r="30" fill="#f08820"/>
        <ellipse cx="224" cy="256" rx="8" ry="6" fill="#ffc070" opacity="0.55"/>
        <path d="M236 240c2-10 8-14 13-14" fill="none" stroke="#3d6b2a" stroke-width="3.5" stroke-linecap="round"/>
        <ellipse cx="244" cy="230" rx="9" ry="4.5" fill="#4caf6a"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#1e4a9a" opacity="0.85"/>
</svg>
