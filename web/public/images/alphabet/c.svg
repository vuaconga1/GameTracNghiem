<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter C">
  <defs>
    <linearGradient id="gcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2d8ef"/>
      <stop offset="0.45" stop-color="#2a78c0"/>
      <stop offset="1" stop-color="#1a5494"/>
    </linearGradient>
    <linearGradient id="gcShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gcGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#6ab8e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a5494" stop-opacity="0"/>
    </radialGradient>
    <filter id="gcSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a5494" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gcBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gcGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gcShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gcSoft)" letter-spacing="-4">C</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">C</text>
  <!-- motif -->
  <g opacity="0.96">
        <circle cx="236" cy="270" r="28" fill="#f2c48a"/>
        <path d="M212 252l6-22 12 16M260 252l-6-22-12 16" fill="#f2c48a"/>
        <circle cx="226" cy="266" r="4" fill="#2b2118"/>
        <circle cx="246" cy="266" r="4" fill="#2b2118"/>
        <ellipse cx="236" cy="280" rx="5" ry="3.5" fill="#e87a6a"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#1a5494" opacity="0.85"/>
</svg>
