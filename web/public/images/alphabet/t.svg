<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter T">
  <defs>
    <linearGradient id="gtBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2dcc8"/>
      <stop offset="0.45" stop-color="#d87830"/>
      <stop offset="1" stop-color="#b85a1a"/>
    </linearGradient>
    <linearGradient id="gtShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gtGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#ffb070" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b85a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="gtSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#b85a1a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gtBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gtGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gtShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gtSoft)" letter-spacing="-4">T</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">T</text>
  <!-- motif -->
  <g opacity="0.96">
        <rect x="228" y="278" width="14" height="30" rx="3" fill="#8a5a2a"/>
        <circle cx="235" cy="252" r="30" fill="#3d8f50"/>
        <circle cx="216" cy="264" r="18" fill="#4caf6a"/>
        <circle cx="254" cy="262" r="16" fill="#2d6b3a"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#b85a1a" opacity="0.85"/>
</svg>
