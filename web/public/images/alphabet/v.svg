<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter V">
  <defs>
    <linearGradient id="gvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4e4c4"/>
      <stop offset="0.45" stop-color="#628f3a"/>
      <stop offset="1" stop-color="#4a6b2a"/>
    </linearGradient>
    <linearGradient id="gvShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gvGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#a8d070" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a6b2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="gvSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4a6b2a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gvBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gvGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gvShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gvSoft)" letter-spacing="-4">V</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">V</text>
  <!-- motif -->
  <g opacity="0.96">
        <rect x="196" y="258" width="72" height="34" rx="7" fill="#4db8d0"/>
        <path d="M230 258h30l10 20H230z" fill="#c8eef6"/>
        <circle cx="214" cy="294" r="9" fill="#2b2118"/>
        <circle cx="252" cy="294" r="9" fill="#2b2118"/>
        <circle cx="214" cy="294" r="3.5" fill="#94a3b8"/>
        <circle cx="252" cy="294" r="3.5" fill="#94a3b8"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#4a6b2a" opacity="0.85"/>
</svg>
