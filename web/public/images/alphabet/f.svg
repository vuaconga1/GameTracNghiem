<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter F">
  <defs>
    <linearGradient id="gfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4e2dd"/>
      <stop offset="0.45" stop-color="#3d9186"/>
      <stop offset="1" stop-color="#2a6b62"/>
    </linearGradient>
    <linearGradient id="gfShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gfGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#6ed9c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a6b62" stop-opacity="0"/>
    </radialGradient>
    <filter id="gfSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2a6b62" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gfBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gfGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gfShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gfSoft)" letter-spacing="-4">F</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">F</text>
  <!-- motif -->
  <g opacity="0.96">
        <ellipse cx="230" cy="270" rx="30" ry="18" fill="#4db8d0"/>
        <path d="M260 270l18-12v24z" fill="#3a9ab0"/>
        <circle cx="214" cy="264" r="4" fill="#0f2740"/>
        <path d="M220 278c7 5 16 5 24 0" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.6"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#2a6b62" opacity="0.85"/>
