<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter U">
  <defs>
    <linearGradient id="guBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0d6ec"/>
      <stop offset="0.45" stop-color="#1f6ab0"/>
      <stop offset="1" stop-color="#0f4c81"/>
    </linearGradient>
    <linearGradient id="guShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="guGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#6aa8e0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0f4c81" stop-opacity="0"/>
    </radialGradient>
    <filter id="guSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f4c81" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#guBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#guGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#guShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#guSoft)" letter-spacing="-4">U</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">U</text>
  <!-- motif -->
  <g opacity="0.96">
        <path d="M200 262c0-24 16-40 36-40s36 16 36 40H200z" fill="#e85d4c"/>
        <path d="M200 262h72" stroke="#c44a3c" stroke-width="3.5"/>
        <path d="M236 262v40" fill="none" stroke="#5a3a1a" stroke-width="4" stroke-linecap="round"/>
        <path d="M236 302c7 7 16 5 16-2" fill="none" stroke="#5a3a1a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#0f4c81" opacity="0.85"/>
