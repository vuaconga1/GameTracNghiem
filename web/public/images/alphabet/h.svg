<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter H">
  <defs>
    <linearGradient id="ghBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0dcc4"/>
      <stop offset="0.45" stop-color="#d07a22"/>
      <stop offset="1" stop-color="#a85f12"/>
    </linearGradient>
    <linearGradient id="ghShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ghGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#ffb86a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a85f12" stop-opacity="0"/>
    </radialGradient>
    <filter id="ghSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#a85f12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#ghBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#ghGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#ghShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#ghSoft)" letter-spacing="-4">H</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">H</text>
  <!-- motif -->
  <g opacity="0.96">
        <path d="M208 278h56v28H208z" fill="#f5e6d0"/>
