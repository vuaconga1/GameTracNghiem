<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter E">
  <defs>
    <linearGradient id="geBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0e4c4"/>
      <stop offset="0.45" stop-color="#558f3a"/>
      <stop offset="1" stop-color="#3d6b2a"/>
    </linearGradient>
    <linearGradient id="geShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="geGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#a8d97a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3d6b2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="geSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3d6b2a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#geBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#geGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#geShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#geSoft)" letter-spacing="-4">E</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">E</text>
  <!-- motif -->
  <g opacity="0.96">
        <ellipse cx="236" cy="268" rx="22" ry="32" fill="#fff8e8"/>
        <ellipse cx="228" cy="254" rx="7" ry="8" fill="#fff" opacity="0.7"/>
        <path d="M218 268c6 3 12 3 18 0s12-3 18 0" fill="none" stroke="#f0c060" stroke-width="2.5" opacity="0.5"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#3d6b2a" opacity="0.85"/>
</svg>
