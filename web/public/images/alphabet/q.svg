<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter Q">
  <defs>
    <linearGradient id="gqBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2e0e0"/>
      <stop offset="0.45" stop-color="#2a9090"/>
      <stop offset="1" stop-color="#1a6b6b"/>
    </linearGradient>
    <linearGradient id="gqShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gqGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#6ad0d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a6b6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="gqSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a6b6b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#gqBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#gqGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#gqShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#gqSoft)" letter-spacing="-4">Q</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">Q</text>
  <!-- motif -->
  <g opacity="0.96">
        <path d="M206 292h60l-5-30-14 12-9-24-9 24-14-12z" fill="#f0c040"/>
        <circle cx="214" cy="264" r="5" fill="#ff6b6b"/>
        <circle cx="236" cy="248" r="5" fill="#7eb0ff"/>
        <circle cx="258" cy="264" r="5" fill="#4caf6a"/>
        <rect x="208" y="292" width="56" height="9" rx="3" fill="#e8a020"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#1a6b6b" opacity="0.85"/>
</svg>
