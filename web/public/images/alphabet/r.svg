<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter R">
  <defs>
    <linearGradient id="grBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0dcdc"/>
      <stop offset="0.45" stop-color="#2a7a7a"/>
      <stop offset="1" stop-color="#1a5a5a"/>
    </linearGradient>
    <linearGradient id="grShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="grGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0" stop-color="#68c8c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a5a5a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a5a5a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="320" height="360" rx="28" fill="url(#grBg)"/>
  <rect width="320" height="360" rx="28" fill="url(#grGlow)"/>
  <rect width="320" height="360" rx="28" fill="url(#grShine)"/>
  <!-- decorative dots -->
  <circle cx="48" cy="56" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="278" cy="72" r="7" fill="#fff" opacity="0.14"/>
  <circle cx="42" cy="300" r="14" fill="#fff" opacity="0.1"/>
  <circle cx="290" cy="310" r="18" fill="#000" opacity="0.08"/>
  <!-- big letter (graphic center) -->
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="#ffffff" filter="url(#grSoft)" letter-spacing="-4">R</text>
  <text x="148" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" letter-spacing="-4">R</text>
  <!-- motif -->
  <g opacity="0.96">
        <path d="M200 300a40 40 0 0 1 80 0" fill="none" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round"/>
        <path d="M208 300a32 32 0 0 1 64 0" fill="none" stroke="#f0c040" stroke-width="7" stroke-linecap="round"/>
        <path d="M216 300a24 24 0 0 1 48 0" fill="none" stroke="#4caf6a" stroke-width="7" stroke-linecap="round"/>
        <path d="M224 300a16 16 0 0 1 32 0" fill="none" stroke="#5b8fd9" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- bottom accent bar -->
  <rect x="0" y="348" width="320" height="12" fill="#1a5a5a" opacity="0.85"/>
</svg>
