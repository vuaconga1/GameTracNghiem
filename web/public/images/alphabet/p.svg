<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Letter P">
  <defs>
    <linearGradient id="gpBg" x1="0" y1="0" x2="1" y2="1">
